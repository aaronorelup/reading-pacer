name: CI

# Every push and pull request: lint + unit tests on Windows, macOS and Linux,
# then build the real Windows installer and Mac app and prove they work on
# fresh machines (install -> launch -> walk every screen -> uninstall).
# Pushing a tag like v1.2.0 does all of that and then publishes a GitHub
# release with the installer, the portable zip and the Mac .dmg attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  linux-app:
    name: Linux - run the app from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages (display server, screenshots)
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick python3-tk
      - name: Install from a clean pip install
        run: pip install .
      - name: Self-test
        run: xvfb-run -a -s "-screen 0 1600x1000x24" reading-pacer --self-test --report report.txt --screenshots shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-linux
          path: |
            report.txt
            shots/

  windows:
    name: Windows - build, install, test, uninstall
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build app + installer
        run: powershell -ExecutionPolicy Bypass -File packaging\build-windows.ps1

      - name: Install silently (like a user clicking through the installer)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\ReadingPacer-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($p.ExitCode) { throw "installer exited with $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\ReadingPacer\ReadingPacer.exe"
          if (-not (Test-Path $exe)) { throw "app not installed at $exe" }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Reading Pacer.lnk"
          if (-not (Test-Path $lnk)) { throw "Start Menu shortcut missing" }

      - name: Upgrade in place (run the installer again over the top)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\ReadingPacer-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($p.ExitCode) { throw "re-install exited with $($p.ExitCode)" }

      - name: Self-test the installed app
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\ReadingPacer\ReadingPacer.exe"
          $p = Start-Process $exe -ArgumentList "--self-test","--report","$PWD\report.txt","--screenshots","$PWD\shots" -PassThru -Wait
          Get-Content report.txt -Encoding UTF8
          if ($p.ExitCode) { throw "self-test failed" }

      - name: Uninstall and check nothing is left behind
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\ReadingPacer"
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          # The uninstaller hands off to a temp copy of itself; give it time to finish.
          for ($i = 0; $i -lt 30 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir; throw "program folder still exists" }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Reading Pacer.lnk"
          if (Test-Path $lnk) { throw "Start Menu shortcut still exists" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{E960C5A7-87AF-41E9-8DD1-E86E8DF6B9A0}_is1"
          if (Test-Path $key) { throw "still listed in Installed Apps" }
          "Uninstalled cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/ReadingPacer-Setup-*.exe
            dist/ReadingPacer-*-portable.zip
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-windows
          path: |
            report.txt
            shots/

  macos-build:
    name: macOS - build universal app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # python.org's universal2 Python bundles Tk 8.6 and lets PyInstaller build
      # one app that runs natively on both Apple Silicon and Intel Macs.
      - name: Install python.org Python
        run: |
          curl -sSLo python.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"
      - name: Build app + dmg
        run: bash packaging/build-macos.sh
      - name: Check it is universal
        run: lipo -archs "dist/Reading Pacer.app/Contents/MacOS/Reading Pacer"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/ReadingPacer-*-macOS.dmg

  macos-test:
    name: macOS - install + test (${{ matrix.label }})
    needs: macos-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Apple Silicon
          - os: macos-15-intel
            label: Intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
      - name: Install from the .dmg (copy to /Applications, like a user would)
        run: |
          hdiutil attach -nobrowse -mountpoint /Volumes/ReadingPacer ReadingPacer-*-macOS.dmg
          cp -R "/Volumes/ReadingPacer/Reading Pacer.app" /Applications/
          hdiutil detach /Volumes/ReadingPacer
          uname -m
      - name: Self-test the installed app
        run: |
          "/Applications/Reading Pacer.app/Contents/MacOS/Reading Pacer" \
            --self-test --report "$PWD/report.txt" --screenshots "$PWD/shots"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-macos-${{ matrix.os }}
          path: |
            report.txt
            shots/

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux-app, windows, macos-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-build"
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No '## $VERSION' section in CHANGELOG.md"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Reading Pacer ${GITHUB_REF_NAME#v}" --notes-file notes.md
